name: Build_CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions: read-all

env:
  LRS_BUILD_CONFIG: Debug
  LRS_RUN_CONFIG: Release
  LRS_RUN_WITH_DEB_CONFIG: RelWithDebInfo
  WIN_BUILD_DIR: C:/lrs_build


jobs:

  #--------------------------------------------------------------------------------
  # RSDSO-21591: build with rosbag2 (default ON) on Ubuntu 25.04 (GCC 14) and
  # Ubuntu 26.04 - the platforms where the rosbag2/zstd 'implicit declaration of
  # function qsort_r' error was reported. GitHub does not host 25.04/26.04 runner
  # images, so the build runs inside the matching Ubuntu container.
  # NOTE: this branch trims all other CI jobs - it exists only to verify this fix.
  U25_U26_Rosbag2:
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:25.04
            name: U25
          - image: ubuntu:26.04
            name: U26
    name: ${{ matrix.name }}_Rosbag2
    timeout-minutes: 60
    steps:
    # git must exist before checkout; the base Ubuntu image ships without it.
    - name: Install toolchain & deps
      shell: bash
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          build-essential cmake git ca-certificates pkg-config libusb-1.0-0-dev libudev-dev
        gcc --version

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - name: Build
      shell: bash
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{env.LRS_RUN_CONFIG}} -DBUILD_SHARED_LIBS=true -DBUILD_EXAMPLES=false -DBUILD_GRAPHICAL_EXAMPLES=false -DBUILD_TOOLS=false -DBUILD_UNIT_TESTS=false -DCHECK_FOR_UPDATES=false -DBUILD_WITH_DDS=false
        cmake --build . -- -j4
